<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Application to shorten links</h1>
        <p>Please use a valid link if not it will not work</p>
    </header>
    <section>
        <main>
            <p class="error_message">
                Generate a short url and redirect on tab
            </p>
            <input type="text" placeholder="Link to shorten" id="url">
            <button id="btn" onclick="shortLink()">Shorten Link</button>
            <div id="result"></div>
        </main>
    </section>
</body>


  <script src="script.js"></script>




</html>
