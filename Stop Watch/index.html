
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="icons8-stop-watch-32.png" type="image/x-icon">
</head>
<body>
    <section>
        <div class="time">
            <div class="inside">
                <span>0 h</span>:
                <span>0 mn</span>:
                <span>0 s</span>:
                <span>0 ms</span>
            </div>
        </div>
        <div class="control">
            <button id="start" onclick="start()">Start</button>
            <div class="button2">
                <button id="stop" onclick="stop()">Stop</button>
                <button id="reset" onclick="reset()">Reset</button>
            </div>
        </div>
    </section>
</body>
<script src="script2.js"></script>
</html>
