<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock/Paper/Scissors</title>
    <link rel="shortcut icon" href="stone (2).png" type="image/x-icon">
    <link rel="stylesheet" href="RockGame.css">
</head>
<body>
    <section>
        <div class="choix">
            <h4>Vous <span id="userChoice"></span></h4>
            <span>VS</span>
            <h4>Ordi <span id="computerChoice"></span></h4>
        </div>
        <div class="resultat"><span id="result"></span></div>
        <div class="button-control">
            <div class="pierre box">
                <div class="image"><img src="stone.png" alt=""></div>
                <button id="stone">Stone</button>
            </div>
            <div class="papier box">
                <div class="image"><img src="paper.png" alt=""></div>
                <button id="paper">Paper</button>
            </div>
            <div class="scissors box">
                <div class="image"><img src="scissors.png" alt=""></div>
                <button id="scissors">Scissors</button>
            </div>
        </div>
    </section>
</body>
<script src="RockGame.js"></script>
</html>
